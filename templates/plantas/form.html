<form enctype="multipart/form-data" method="post">   <!--enctype="multipart/form-data formulario permite subiur imagen-->
    {% csrf_token %}

    {% for campo in formulario %} <!--recorre todos los campos que vienen de nuestro PlantaForm-->

    <div class="mb-3">
        <label for="" class="form-label">{{ campo.label }}</label>

        {% if campo.field.widget.input_type == 'file' and campo.value %}
            <img src="{{ MEDIA_URL }}/imagenes/{{ campo.value }}" width="100" alt="" srcset="">
        {% endif %}

        <input
            type="{{ campo.field.widget.input_type }}"
            class="form-control"
            name="{{ campo.name }}"
            id=""
            aria-describedby="helpId"
            placeholder="{{ campo.label }}"
            value="{{ campo.value | default:'' }}"
        />

        <br>
    </div>

    <div class="col-12 help-text">{{ campo.errors }}</div>

    {% endfor %}

    <input
        name=""
        id=""
        class="btn btn-success"
        type="submit"
        value="Enviar informacion"
    />

    <a
        name=""
        id=""
        class="btn btn-primary"
        href="{% url 'plantas' %}"
        role="button"
    >Cancelar</a>

</form>
