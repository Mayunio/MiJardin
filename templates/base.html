

<!-- Para definir bloques que serán utilizados por las demás páginas mediante herencia de templates -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>{% block titulo %}MiJardin{% endblock %}</title>
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg bg-success">
        <div class="container-fluid">

            <a class="navbar-brand text-white" href="{% url 'inicio' %}">
                 MiJardin
            </a>

            <div class="navbar-nav">                                        <!--href es donde nos lleva el enlace, en este caso a /nosotros-->
               
                                                                             
                <a class="nav-link text-white" href="{% url 'inicio' %}">   <!-- "{% url 'inicio' %}" es la direccion que se genera-->
                    Inicio
                
                <a class="nav-link text-white" href="{% url 'nosotros' %}">  
                    Nosotros 

                <a class="nav-link text-white" href="{% url 'plantas' %}">
                    Plantas
            
                </a>

            </div>

        </div>
    </nav>

    {% block contenido %}
    {% endblock %}

</body>
</html>
